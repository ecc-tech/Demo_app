
apiVersion: apps/v1
kind: Deployment # Kubernetes resource kind we are creating
metadata:
  name: boardgame-deployment
  namespace: demoapp-dev
spec:
  selector:
    matchLabels:
      app: boardgame
  replicas: 2 # Number of replicas that will be created for this deployment
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      containers:
        - name: boardgame
          image: yennefer007/demoapp:v1 # Image that will be used to containers in the cluster
          imagePullPolicy: Always
          ports:
            - containerPort: 8080 # The port that the container is running on in the cluster
          volumeMounts:
            - name: boardgame-storage
              mountPath: /app/data  # Path inside the container where volume is mounted
      volumes:
        - name: boardgame-storage
          persistentVolumeClaim:
            claimName: boardgame-pvc  # Must match the PVC metadata.name above

---
apiVersion: v1
kind: PersistentVolumeClaim # PVC to request persistent storage
metadata:
  name: boardgame-pvc
  namespace: demoapp-dev
spec:
  accessModes:
    - ReadWriteOnce           # Single node read/write
  resources:
    requests:
      storage: 1Gi            # Storage size — adjust as needed

---
