# =====================================================
# NAMESPACES
# =====================================================
apiVersion: v1
kind: Namespace
metadata:
  name: api-service
---
apiVersion: v1
kind: Namespace
metadata:
  name: metadata
---
apiVersion: v1
kind: Namespace
metadata:
  name: dedup
---
apiVersion: v1
kind: Namespace
metadata:
  name: data-service

# =====================================================
# API SERVICE (HTTPD)
# =====================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: httpd
        image: httpd:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: api-service
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: api-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

# =====================================================
# METADATA SERVICE (NGINX)
# =====================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-deployment
  namespace: metadata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metadata
  template:
    metadata:
      labels:
        app: metadata
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: metadata
spec:
  type: ClusterIP
  selector:
    app: metadata
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metadata-hpa
  namespace: metadata
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metadata-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

# =====================================================
# DEDUP SERVICE (CUSTOM HTTP SERVER)
# =====================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedup-deployment
  namespace: dedup
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dedup
  template:
    metadata:
      labels:
        app: dedup
    spec:
      containers:
      - name: dedup
        image: hashicorp/http-echo
        args:
          - "-text=dedup service"
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dedup-service
  namespace: dedup
spec:
  type: ClusterIP
  selector:
    app: dedup
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dedup-hpa
  namespace: dedup
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dedup-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

# =====================================================
# DATA SERVICE (TOMCAT)
# =====================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-deployment
  namespace: data-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
      - name: tomcat
        image: tomcat:9
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: data-service
spec:
  type: ClusterIP
  selector:
    app: data
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-hpa
  namespace: data-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

# =====================================================
# ALB INGRESS (ONE PER NAMESPACE - BEST PRACTICE)
# =====================================================

# API INGRESS
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: api-service
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: common-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80

# METADATA INGRESS
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metadata-ingress
  namespace: metadata
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: common-alb
spec:
  rules:
  - http:
      paths:
      - path: /meta
        pathType: Prefix
        backend:
          service:
            name: metadata-service
            port:
              number: 80

# DEDUP INGRESS
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dedup-ingress
  namespace: dedup
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: common-alb
spec:
  rules:
  - http:
      paths:
      - path: /dedup
        pathType: Prefix
        backend:
          service:
            name: dedup-service
            port:
              number: 80

# DATA INGRESS
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-ingress
  namespace: data-service
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: common-alb
spec:
  rules:
  - http:
      paths:
      - path: /data
        pathType: Prefix
        backend:
          service:
            name: data-service
            port:
              number: 80